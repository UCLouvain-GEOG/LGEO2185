project:
  type: website
  output-dir: docs
  execute-dir: file
  render:
    - index.qmd
    - R Basics/**.qmd
    - Intro to Spatial Data/**.qmd
    - Collaboration/**.qmd
    - GeoProjects/**.qmd
    - ML/**.qmd
    - Efficient Spatial IO/**.qmd
    - GEE/**.qmd

website:
  title: "LGEO2185: Advanced Geoprocessing"
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Home"
        file: index.qmd
      - section: "R Basics"
        contents:
          - text: "Lecture"
            file: R Basics/LGEO2185_IntroductionR.qmd
          - text: "Assignment"
            file: R Basics/LGEO2185_IntroductionR_assignment.qmd
      - text: "Tidyverse"
        file: R Basics/LGEO2185_Introduction_to_tidyverse.qmd
      - text: "Intro to Spatial Data"
        file: Intro to Spatial Data/LGEO2185_Intro_to_Spatial_Data.qmd
      - section: "GeoProjects Intro"
        contents:
          - text: "Coding Principles"
            file: GeoProjects/LGEO2185_Clean_coding_principles.qmd
          - text: "Lecture 1"
            file: GeoProjects/LGEO2185_Basic_projects.qmd
          - text: "In Class Excercise"
            file: GeoProjects/LGEO2185_Basic_projects_InClass_Assignment.qmd 
          - text: "Lecture 2"
            file: GeoProjects/LGEO2185_Geoprojects.qmd
      - section: "Collaboration"
        contents:
          - text: "Drafting your project with Quarto"
            file: Collaboration/LGEO2185_Drafting_your_project_with_Quarto.qmd
          - text: "Intro to Git and Github"
            file: Collaboration/LGEO2185_Intro_to_Git_and_Github.qmd
      - section: "ML in Geosciences"
        contents:
          - text: "Intro to ML"
            file: ML/Machine_Learning_in_Geosciences.qmd
      - section: "Efficient Spatial I/O"
        contents:
          - text: "Lecture"
            file: Efficient Spatial IO/LGEO2185_Efficient_Spatial_Data_I_O.qmd
          - text: "Assignment"
            file: Efficient Spatial IO/LGEO2185_Efficient_Spatial_Data_I_O_Assignment.qmd
      - section: "GEE"
        contents:
          - text: "Demo GEE"
            file: GEE/GEE.qmd
          - text: "RF Classification"
            file: GEE/ML_RFmodels.qmd

bibliography: biblio.bib

format:
  html:
    theme:
      - zephyr
      - _brand.yml
    css: styles.css
    toc: false
    standalone: true
    embed-resources: true

execute:
  echo: true
  warning: false
  error: false